target_id: planar-transport-sensitivity-certificates
search_date: 2026-10-07
intended_contribution_unit: computation and scoped certificate theorems (envelope, tightness, convergent refinement)
claim:
  exact_statement: |
    For uniform source on any rational convex planar polygon of positive area,
    certify L2 displacement of the gradients of two finite rational affine maxima;
    separately check finite target-coupling primal/dual certificates and bound
    displacement for every affine coefficient choice in a specified rational box.
  exclusions:
    - No claim to the general optimal one-third stability theorem.
    - No discovery claim for power diagrams or overlay couplings.
    - Prescribed target-mass solving and high-dimensional scalability are excluded.
